<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#314d3c">
  <title>{% block title %}Daymark{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='daymark-icon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='daymark-icon.svg') }}">
  <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
  <script>
    try {
      const savedTheme = localStorage.getItem("daymark-theme");
      if (savedTheme === "dark") document.documentElement.dataset.theme = "dark";
      if (localStorage.getItem("daymark-language") === "en") document.documentElement.lang = "en";
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <button class="language-toggle" type="button" data-language-toggle aria-label="Change application language" title="Change application language">English</button>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}<div class="flash-stack">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  <script src="{{ url_for('static', filename='language.js') }}" defer></script>
</body>
</html>
